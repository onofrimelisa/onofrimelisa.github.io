services:
  client:
    build: ./client
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - server

  server:
    build: ./server
    ports:
      - '3000:3000'
    depends_on:
      - mongo
      - redis
    environment:
      MONGODB_URI: mongodb://mongo:27017/collaborative-board
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-change-in-production
      PORT: 3000

  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  seed:
    image: curlimages/curl:latest
    depends_on:
      - server
    volumes:
      - ./sample-data:/data:ro
      - ./scripts:/scripts:ro
    entrypoint: ["sh", "/scripts/seed.sh"]

volumes:
  mongo-data:
